name: Build JARVIS Windows desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '!.github/workflows/windows-desktop.yml'
      - '.gitattributes'
      - '**.py'
      - '*.txt'
      - 'skills/**'
      - 'bundled_addons/**'
      - 'README.md'
      - 'LICENSE'
      - 'TERMS_OF_USE.md'
      - 'CONTRIBUTING.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'installer_windows.iss'
      - 'build_windows.bat'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install app and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q .
      - name: Build standalone Windows desktop app
        run: python build_windows.py
      - name: Install Inno Setup compiler
        run: choco install innosetup --yes --no-progress
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found: $compiler" }
          & $compiler installer_windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Prepare portable distribution archive
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/JARVIS/JARVIS.exe')) { throw 'The app executable was not produced.' }
          Compress-Archive -Path 'dist/JARVIS' -DestinationPath 'dist/JARVIS-Windows-Portable.zip' -CompressionLevel Optimal
      - name: Upload portable desktop app
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-Portable
          path: |
            dist/JARVIS-Windows-Portable.zip
            dist/JARVIS-Local-Setup.exe
          if-no-files-found: error
          retention-days: 14
